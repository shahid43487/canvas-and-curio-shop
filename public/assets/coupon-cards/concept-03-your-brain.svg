<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-labelledby="title desc"><title id="title">YOUR BRAIN</title><desc id="desc">A pink brain character operating a teal mechanical workstation with floating tools.</desc><defs><clipPath id="clip"><rect x="3" y="3" width="294" height="414" rx="17"/></clipPath><style>.ink{stroke:#171d32;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.brain{transform-box:fill-box;transform-origin:center;animation:think 3.2s ease-in-out infinite}.tool{transform-box:fill-box;transform-origin:center;animation:tool 4.6s ease-in-out infinite alternate}@keyframes think{0%,100%{transform:rotate(-1deg) translateY(0)}50%{transform:rotate(1deg) translateY(-3px)}}@keyframes tool{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}@media(prefers-reduced-motion:reduce){.brain,.tool{animation:none}}</style></defs><g clip-path="url(#clip)"><g id="card-background"><rect width="300" height="420" fill="#12c8bb"/></g><g id="card-border"><rect x="3" y="3" width="294" height="414" rx="17" fill="none" stroke="#fff8df" stroke-width="6"/></g><g id="header-title"><text x="21" y="39" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="900" letter-spacing=".3">YOUR BRAIN</text></g><g id="header-subtitle"><rect x="23" y="50" width="158" height="25" rx="3" fill="#fff2d2" stroke="#171d32" stroke-width="3"/><text x="31" y="67" font-family="Arial,sans-serif" font-weight="bold" font-size="11" fill="#171d32">腦袋怎麼想 03</text><text x="234" y="69" fill="#fff" font-size="12" font-weight="bold">FOCUS</text></g><g id="decorative-left"><path d="M28 108v255m9-255v255M46 108v255" stroke="#087d7e" stroke-width="3"/></g><g id="character-body"><path class="ink" fill="#e9f3d5" d="M75 122h57v24H75zM75 195h57v24H75zM75 269h57v24H75z"/><path class="ink" fill="#a6e9df" d="M82 129h43v10H82zm0 74h43v10H82zm0 74h43v10H82z"/><path class="ink" fill="#f7a64f" d="M124 147h37v19h-37zm0 74h37v19h-37z"/><path class="ink" fill="#e9f3d5" d="M154 160h36v16h-36zm0 74h36v16h-36z"/></g><g id="character-head" class="brain"><path class="ink" fill="#f08ecf" d="M143 119q-17-12-28 2-15-2-17 14-13 12-3 25-8 15 7 24 5 17 23 13 11 12 23 4 13 9 22-4 16 0 18-16 15-7 6-22 8-13-3-23-3-18-20-18-7-16-25-8z"/><path class="ink" fill="none" d="M130 123q-10 12 0 21t-5 18m30-33q-10 9 0 18t-2 17m-41 1q11-7 17 4t-4 15m29-5q-8 11 4 17m-22-1q8-8 15-1"/><circle cx="130" cy="151" r="3" fill="#171d32"/><circle cx="155" cy="151" r="3" fill="#171d32"/><path d="M133 164q10 8 19 0" stroke="#171d32" stroke-width="3" fill="none" stroke-linecap="round"/></g><g id="character-accessories"><path class="ink" fill="#fff5dc" d="M198 82h42l8 11-8 10h-42z"/><path class="ink" fill="#f4a3d3" d="M213 90h19v5h-19z"/><path class="ink" fill="#f8d85d" d="M175 192l25 8-13 23-24-8z"/><path class="ink" fill="#fff5dc" d="M188 202l25 5-8 16-25-5z"/><path class="ink" fill="#f7a64f" d="M135 204q-13 0-14 13l-5 28 16 8 12-24z"/><path class="ink" fill="#e9f3d5" d="M142 238h39v17h-39z"/><path class="ink" fill="#fff5dc" d="M197 271l29-10 10 12-22 21z"/><path class="ink" fill="#f08ecf" d="M137 280q-12-8-20 3l-5 22 16 8 15-18z"/></g><g id="decorative-right" class="tool"><path class="ink" fill="#fff5dc" d="M225 108l12-15 10 8-12 16z"/><path class="ink" fill="#171d32" d="M238 98l10-13 7 5-10 14z"/><path class="ink" fill="#fff5dc" d="M213 299l22-22 9 9-22 22z"/><path class="ink" fill="#f7a64f" d="M236 277l10-12 8 8-10 12z"/></g><g id="decorative-particles"><circle cx="209" cy="145" r="4" fill="#fff5dc"/><circle cx="232" cy="183" r="5" fill="#f08ecf"/><path d="M209 253l8-8m-8 0 8 8" stroke="#fff5dc" stroke-width="3"/></g><g id="footer-decoration"><path d="M54 351h205" stroke="#fff5dc" stroke-width="2" stroke-dasharray="3 7"/><text x="150" y="385" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" letter-spacing="2">THINK OUTSIDE THE BOX</text></g></g></svg>